<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F4E8D3"/>

  <!-- Color blocks pattern -->
  <rect x="0" y="0" width="300" height="210" fill="#E63946" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="300" y="0" width="200" height="210" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="500" y="0" width="400" height="105" fill="#D4A574" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="900" y="0" width="300" height="210" fill="#E63946" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="500" y="105" width="200" height="105" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="700" y="105" width="200" height="105" fill="#F4E8D3" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Bottom blocks -->
  <rect x="0" y="420" width="200" height="210" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="200" y="420" width="300" height="210" fill="#D4A574" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="500" y="420" width="200" height="210" fill="#E63946" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="700" y="420" width="200" height="210" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="900" y="420" width="300" height="210" fill="#D4A574" stroke="#1A1A1A" stroke-width="4"/>

  <!-- Center content area -->
  <rect x="100" y="240" width="1000" height="160" fill="#F4E8D3" stroke="#1A1A1A" stroke-width="6"/>

  <!-- Shadow for center -->
  <rect x="108" y="248" width="1000" height="160" fill="#1A1A1A" opacity="0.15"/>

  <!-- Name -->
  <text x="600" y="310" text-anchor="middle" font-family="monospace, 'Space Mono'" font-weight="bold" font-size="64" fill="#1A1A1A" letter-spacing="2">BILLY NDIZEYE</text>

  <!-- Tagline -->
  <text x="600" y="370" text-anchor="middle" font-family="sans-serif, 'Inter'" font-size="24" fill="#1A1A1A" opacity="0.7">Chicago tech, capital, and community</text>

  <!-- Red underline -->
  <rect x="350" y="320" width="500" height="6" fill="#E63946"/>
</svg>
